<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleGroqChat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="title">SimpleGroqChat</h1>
            <p class="subtitle">Powered by Groq</p>
        </header>

        <!-- Chat Area -->
        <div id="chat-area" class="chat-area">
            <!-- Welcome message -->
            <div class="message ai-message">
                <div class="message-content">
                    Welcome to SimpleGroqChat! Type a message to start chatting with AI.
                </div>
                <div class="message-time">System</div>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="loading hidden">
            <div class="loading-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <span class="loading-text">AI is thinking...</span>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-container">
                <input 
                    type="text" 
                    id="message-input" 
                    class="message-input" 
                    placeholder="Type your message here..." 
                    maxlength="1000"
                    autocomplete="off"
                >
                <button id="send-button" class="send-button" type="button">
                    Send
                </button>
            </div>
        </div>
    </div>

    <!-- Error Modal -->
    <div id="error-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-button" onclick="closeErrorModal()">&times;</span>
            <h3>Error</h3>
            <p id="error-message"></p>
            <button onclick="closeErrorModal()" class="modal-button">OK</button>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
